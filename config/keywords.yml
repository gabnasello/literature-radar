# PubMed topic searches are independent of the monitored journal list.
settings:
  initial_backfill_days: 7
  overlap_days: 2
  pubmed_batch_size: 200
  email: ""

priority:
  # Exact preferred titles rank first; other titles from these publishers rank next.
  journals:
    - Nature
    - Science
    - Cell
    - Nature Biomedical Engineering
    - Nature Biotechnology
    - Nature Materials
    - Nature Immunology
    - Science Immunology
    - Immunity
    - Cell Biomaterials
    - Biomaterials
    - Advanced Materials
  publisher_groups:
    - name: Springer Nature
      journals:
        - Nature Communications
        - Nature Medicine
        - Nature Cell Biology
        - Nature Chemical Biology
        - Nature Methods
        - Nature Nanotechnology
        - Nature Reviews Immunology
        - Scientific Reports
    - name: AAAS
      journals:
        - Science Advances
        - Science Translational Medicine
        - Science Signaling
    - name: Cell Press
      journals:
        - Cell Stem Cell
        - Molecular Cell
        - Cell Reports
        - Cancer Cell
        - Developmental Cell
        - Trends in Immunology
    - name: Elsevier
      journals:
        - Acta Biomaterialia
        - Journal of Controlled Release
        - Biomaterials Advances
        - Materials Today Bio
        - Bioactive Materials

keywords:
  - id: regulatory-t-cells
    name: Regulatory T cells
    # Broad PubMed query: MeSH indexing plus title/abstract wording and common abbreviation.
    query: '("Regulatory T-Lymphocytes"[MeSH Terms] OR "regulatory T cell"[Title/Abstract] OR "regulatory T cells"[Title/Abstract] OR Treg[Title/Abstract] OR Tregs[Title/Abstract])'
    enabled: true
