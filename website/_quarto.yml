project:
  type: website
  output-dir: ../_site
  execute-dir: project
  render:
    - index.qmd
    - papers.qmd

website:
  title: "Literature Radar"
  site-url: "https://gabnasello.github.io/literature-radar/"
  description: "A continuously updated view of new papers from selected journals, collected through PubMed."
  navbar:
    left:
      - href: index.qmd
        text: Overview
      - href: papers.qmd
        text: Papers
    right:
      - icon: github
        href: https://github.com/gabnasello/literature-radar
        aria-label: GitHub repository
  page-footer:
    left: "Literature Radar · PubMed journal monitoring"
    right: "AI-generated summaries should be checked against the original paper."

format:
  html:
    theme: flatly
    css: styles.css
    toc: false
    smooth-scroll: true

execute:
  echo: false
  warning: false
  message: false
