name: LLM benchmark

on:
  workflow_dispatch:
    inputs:
      sample_size:
        description: Number of abstracts to benchmark with both models
        required: false
        default: "12"
        type: string
      seed:
        description: Fixed random seed for reproducible sampling
        required: false
        default: "20261113"
        type: string

permissions:
  contents: write

concurrency:
  group: literature-radar-llm-benchmark
  cancel-in-progress: false

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check Gemini API secret
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "Missing GEMINI_API_KEY. Add it in Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev libssl-dev libxml2-dev libuv1-dev

      - name: Set up R
        uses: r-lib/actions/setup-r@v2

      - name: Install and verify R dependencies
        run: |
          Rscript -e 'packages <- c("httr2", "jsonlite", "yaml", "testthat"); missing <- packages[!vapply(packages, requireNamespace, logical(1), quietly = TRUE)]; if (length(missing)) install.packages(missing, repos = "https://cloud.r-project.org"); missing <- packages[!vapply(packages, requireNamespace, logical(1), quietly = TRUE)]; if (length(missing)) stop("Failed to install required R packages: ", paste(missing, collapse = ", "))'

      - name: Run unit tests
        run: Rscript tests/testthat.R

      - name: Install Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh

      - name: Start Ollama and download model
        env:
          OLLAMA_CONTEXT_LENGTH: "4096"
          OLLAMA_NUM_PARALLEL: "1"
        run: |
          nohup ollama serve > "$RUNNER_TEMP/ollama.log" 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:11434/api/tags >/dev/null; then
              break
            fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:11434/api/tags >/dev/null
          OLLAMA_MODEL=$(Rscript -e 'cat(yaml::read_yaml("config/llm.yml")$benchmark$ollama$model)')
          ollama pull "$OLLAMA_MODEL"

      - name: Run paired LLM benchmark
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BENCHMARK_SAMPLE_SIZE: ${{ inputs.sample_size }}
          BENCHMARK_SEED: ${{ inputs.seed }}
        run: Rscript scripts/run_benchmark.R

      - name: Commit benchmark outputs (including partial results)
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -d data/benchmarks ]; then git add data/benchmarks; fi
          if git diff --cached --quiet; then
            echo "No benchmark outputs to commit."
          else
            git commit -m "chore: add LLM benchmark results $(date -u +%Y-%m-%d)"
            git push
          fi
