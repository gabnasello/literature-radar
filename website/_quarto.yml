project:
  type: website
  output-dir: _site
  execute-dir: project

website:
  title: "Literature Radar"
  site-url: "https://gabnasello.github.io/literature-radar/"
  description: "A date-based archive of PubMed updates and AI-generated paper summaries from selected journals."
  navbar:
    right:
      - icon: github
        href: https://github.com/gabnasello/literature-radar
        aria-label: GitHub repository

format:
  html:
    theme: flatly
    css: styles.css
    toc: false
    smooth-scroll: true

execute:
  echo: false
  warning: false
  message: false
