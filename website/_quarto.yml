project:
  type: website
  output-dir: _site
  execute-dir: project
  resources:
    - manifest.webmanifest
    - service-worker.js
    - pwa.js
    - images/logo.svg
    - images/icon.svg
    - images/icon-192.png
    - images/icon-512.png
    - images/icon-180.png

website:
  title: "Literature Radar"
  site-url: "https://gabnasello.github.io/literature-radar/"
  description: "A date-based archive of PubMed updates and AI-generated paper summaries from selected journals."
  favicon: images/icon.svg
  navbar:
    left:
      - text: Journals
        href: index.qmd
      - text: Keywords
        href: keywords/regulatory-t-cells.html
    logo: images/logo.svg
    logo-alt: "Literature Radar"
    right:
      - text: Install
        href: "#install-app"
      - icon: github
        href: https://github.com/gabnasello/literature-radar
        aria-label: GitHub repository

format:
  html:
    theme: flatly
    css: styles.css
    include-in-header: pwa-head.html
    include-after-body: pwa-install.html
    toc: false
    smooth-scroll: true

execute:
  echo: false
  warning: false
  message: false
